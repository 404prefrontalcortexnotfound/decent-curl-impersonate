name: Fetch service image
on:
  pull_request:
    paths: ['python/**', 'pyproject.toml', 'uv.lock', 'Dockerfile', '.dockerignore', '.github/workflows/fetch-image.yml']
  push:
    branches: [main]
    paths: ['python/**', 'pyproject.toml', 'uv.lock', 'Dockerfile', '.dockerignore', '.github/workflows/fetch-image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/404prefrontalcortexnotfound/decent-curl-impersonate:${{ github.sha }}
      - run: echo "Image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
