name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Publish with npm trusted publishing
    needs: test
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Require exact tag and package version match
        run: |
          # shellcheck disable=SC2016
          node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) { throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match package ${p.version}`); }'
      - run: bun run typecheck
      - run: bun run build
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/decent-curl-pack.json"
          node scripts/verify-package.mjs "$RUNNER_TEMP/decent-curl-pack.json"
      - name: Publish with provenance through npm OIDC
        run: npm publish --access public --provenance
