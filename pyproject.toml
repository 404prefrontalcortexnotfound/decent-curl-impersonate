[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "decent-curl-impersonate"
version = "0.2.2"
description = "Python worker for the decent-curl-impersonate Pi package"
requires-python = ">=3.13,<3.15"
dependencies = [
  "curl-cffi==0.15.0",
  "mcp>=2.1,<3",
  "uvicorn>=0.52,<1",
]

[project.scripts]
decent-curl-mcp = "decent_curl_impersonate.mcp_server:main"
decent-curl-http = "decent_curl_impersonate.http_server:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "websockets>=15,<17",
]

[tool.hatch.build.targets.wheel]
packages = ["python/decent_curl_impersonate"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
